name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the private-data check scans the whole history

      - name: Toolchain
        run: |
          swift --version
          sysctl -n hw.ncpu
          /usr/bin/git --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Report tests (failures and anything that did not finish)
        if: always()
        run: scripts/ci-test-report.sh test.log

      - name: No agent names in TopsideCore or TopsideEngine
        run: |
          if grep -rn -i -E "claude|codex" Sources/TopsideCore Sources/TopsideEngine; then
            echo "Agent-specific code belongs in TopsideRunners."
            exit 1
          fi

      - name: No private data
        run: |
          scripts/check-no-private-data.sh
          scripts/check-no-private-data.sh --history
