# The Topside app. Generate the Xcode project with:
#   xcodegen generate --spec App/project.yml
# The project file is not committed; this spec is the source of truth.
name: Topside
options:
  bundleIdPrefix: io.github.wzhang68
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Topside:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Topside:
    type: application
    platform: macOS
    sources:
      - path: Topside
    dependencies:
      - package: Topside
        product: TopsideCore
      - package: Topside
        product: TopsideEngine
      - package: Topside
        product: TopsideRunners
      - package: Topside
        product: TopsideUIModel
    settings:
      base:
        PRODUCT_NAME: Topside
        PRODUCT_BUNDLE_IDENTIFIER: io.github.wzhang68.Topside
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Topside
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        # Signed to run locally only (no Developer ID yet: decision Q6).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # Not sandboxed: the app starts agent CLIs and works in your repositories.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
